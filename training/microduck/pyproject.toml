[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-duck-microduck"
version = "0.1.0"
description = "Project-owned Microduck tasks, robot models, actuators and policy interfaces"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["oh-my-duck", "mjlab==1.3.0", "better-actuator-models", "scipy>=1.16", "onnxruntime>=1.24.4", "huggingface_hub>=0.27.0"]

[project.scripts]
omd-publish = "omd_microduck.publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omd_microduck = ["robot/**/*"]
