[project]
name = "oh-my-duck-mujoco-frameworks"
version = "0.1.0"
description = "Optional RL adapters around the unchanged official Microduck mjlab tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab-microduck", "torch==2.9.1", "better-actuator-models",
  "stable-baselines3==2.7.1",
]

[dependency-groups]
test = ["pytest>=8"]

[tool.uv]
package = false
# Same overrides as pinned microduck_rl: messaging transports are not used.
override-dependencies = ["protobuf>=4.0,<7.0", "onnx>=1.20.1", "zmq ; python_version < '3.0'"]

[tool.uv.sources]
mjlab-microduck = { path = "../../.cache/upstream/microduck_rl", editable = true }
better-actuator-models = { git = "https://github.com/Rhoban/bam", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
