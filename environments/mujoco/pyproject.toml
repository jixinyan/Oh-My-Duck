[project]
name = "oh-my-duck-mujoco-frameworks"
version = "0.1.0"
description = "Native RL frameworks for project-owned Microduck tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "oh-my-duck[rl]",
   "torch==2.9.1", "torchvision==0.24.1", "warp-lang==1.12.0", "better-actuator-models",
  "imageio[ffmpeg]", "matplotlib>=3.10.9",
]

[project.optional-dependencies]
sb3 = ["stable-baselines3==2.7.1"]

[dependency-groups]
test = ["pytest>=8"]

[tool.uv]
package = false
# Same overrides as pinned microduck_rl: messaging transports are not used.
override-dependencies = ["protobuf>=4.0,<7.0", "onnx>=1.20.1", "zmq ; python_version < '3.0'"]

[tool.uv.sources]
oh-my-duck = { path = "../..", editable = true }
better-actuator-models = { git = "https://github.com/Rhoban/bam", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
