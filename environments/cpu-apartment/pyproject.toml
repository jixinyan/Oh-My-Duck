[project]
name = "oh-my-duck-cpu-apartment"
version = "0.1.0"
description = "CPU MuJoCo apartment policy runtime and physical Harness bridge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "oh-my-duck",
  "mujoco==3.8.0",
  "better-actuator-models",
  "mjlab==1.3.0",
  "torch==2.9.1",
  "warp-lang==1.12.0",
  "scipy==1.18.1",
  "onnxruntime==1.30.0",
  "onnx==1.23.1",
  "Pillow==12.3.0",
  "huggingface-hub==1.6.0",
  "jsonschema==4.25.1",
  "websockets==17.0.1",
]

[tool.uv]
package = false
override-dependencies = ["websockets==17.0.1"]

[tool.uv.sources]
oh-my-duck = { path = "../..", editable = true }
better-actuator-models = { git = "https://github.com/Rhoban/bam", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
