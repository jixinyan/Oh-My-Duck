[project]
name = "oh-my-duck-isaac-newton"
version = "0.1.0"
description = "Isolated Isaac Lab and Newton integration for Oh My Duck"
requires-python = ">=3.12,<3.13"
dependencies = [
  "oh-my-duck[rl]",
  "isaaclab", "isaaclab-assets", "isaaclab-newton[all]",
  "isaaclab-ov", "isaaclab-contrib", "isaaclab-physx", "isaaclab-rl[rsl-rl]", "isaaclab-tasks", "isaaclab-visualizers",
  "torch==2.10.0", "torchvision==0.25.0", "newton[sim]==1.2.1",
  "warp-lang==1.13.0", "mujoco-warp==3.8.0.3", "mujoco==3.8.0",
  "onnxruntime", "imageio[ffmpeg]",
   "mjlab==1.3.0", "better-actuator-models", "scipy>=1.16",
  "moviepy==2.2.1",
  # RSL 5.0.1 uses Wandb Settings.start_method; match the validated MuJoCo CLI/logger.
  "wandb==0.24.0", "tyro==1.0.5",
]

[project.optional-dependencies]
sb3 = ["isaaclab-rl[sb3]", "stable-baselines3==2.7.1"]
native-harness = ["jsonschema==4.25.1", "websockets==17.0.1"]

[tool.uv]
package = false
# Isaac pins 4.12.2, but official mjlab/tyro needs >=4.13; this typing-only
# compatibility override is explicit and covered by installed-environment tests.
# Preserve Isaac's Pillow pin; MoviePy declares <12. Our render path uses
# imageio, and installed video-writing checks cover the retained Pillow version.
# native Harness 的 policy transport 固定 websockets 17；运行验证覆盖 Viser 服务。
override-dependencies = ["typing-extensions==4.15.0", "pillow==12.2.0", "websockets==17.0.1"]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
oh-my-duck = { path = "../..", editable = true }
better-actuator-models = { git = "https://github.com/Rhoban/bam", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
isaaclab = { path = "../../.cache/upstream/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-newton = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_newton", editable = true }
isaaclab-physx = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_physx", editable = true }
isaaclab-contrib = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_contrib", editable = true }
isaaclab-ov = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_ov", editable = true }
isaaclab-rl = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab-visualizers = { path = "../../.cache/upstream/IsaacLab/source/isaaclab_visualizers", editable = true }
