[project]
name = "oh-my-duck-voice"
version = "0.1.0"
description = "Qwen ASR and TTS inference for Oh My Duck"
requires-python = ">=3.12,<3.13"
dependencies = [
  "oh-my-duck",
  "soundfile>=0.13.1",
  "qwen-tts",
  "huggingface-hub",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "torch==2.9.1",
  "torchaudio==2.9.1",
]

[dependency-groups]
test = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
oh-my-duck = { path = "../..", editable = true }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
