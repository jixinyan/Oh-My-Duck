<title id="title">Train once, evaluate across simulation backends</title><desc id="desc">First-party Microduck assets, task recipes and actors feed two simulator backends and two native PPO frameworks. Export normalized policies, compare in both simulators and rehearse with CPU MuJoCo BAM before future hardware validation.</desc>
