[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-duck"
version = "0.1.0"
description = "Modular Microduck tools, voice, recording and dual-backend training"
requires-python = ">=3.12"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md", "third_party/microduck_rl/LICENSE", "docs/third_party/isaaclab-microduck-LICENSE.txt"]
dependencies = []

[project.optional-dependencies]
rl = ["mjlab==1.3.0", "better-actuator-models", "scipy>=1.16", "onnxruntime>=1.24.4", "huggingface_hub>=0.27.0"]
voice = ["soundfile>=0.13.1"]

[project.scripts]
omd = "oh_my_duck.cli:main"
omd-publish = "oh_my_duck.rl.artifacts.publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"oh_my_duck.robotics.microduck" = ["microduck/**/*", "xl330_test_bench/**/*", "odom_anchor_sets.json"]
"oh_my_duck.rl.backends.isaac_newton" = ["resources/*.usda"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
