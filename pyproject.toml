[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-duck"
version = "0.1.0"
description = "Modular Microduck tools, voice, recording and dual-backend training"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.scripts]
omd = "oh_my_duck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
