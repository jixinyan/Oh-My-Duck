[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-duck"
version = "0.1.0"
description = "Modular Microduck tools, voice, recording and dual-backend training"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
rl = ["mjlab==1.3.0", "better-actuator-models", "scipy>=1.16", "onnxruntime>=1.24.4", "huggingface_hub>=0.27.0"]

[project.scripts]
omd = "oh_my_duck.cli:main"
omd-publish = "oh_my_duck.rl.artifacts.publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"oh_my_duck.robotics.microduck" = ["microduck/**/*"]
"oh_my_duck.rl.backends.isaac_newton" = ["resources/*.usda"]
